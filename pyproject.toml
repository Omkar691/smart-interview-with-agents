[project]
name = "langraph-pro"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "omkar abhale", email = "omkarabhale1111@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.9.0",
    "beautifulsoup4>=4.12.0",
    "colorama>=0.4.6",
    "html5lib>=1.1",
    "langchain>=1.4.2",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.12",
    "langgraph-cli[inemem,inmem]>=0.4.31",
    "langsmith>=0.14.0",
    "lxml>=5.0.0",
    "mcp>=1.30.0",
    "orjson>=3.9.0",
    "pandas>=2.0.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "rich>=13.7.0",
    "tenacity>=8.2.0",
    "tiktoken>=0.6.0",
]

[project.scripts]
langraph-pro = "langraph_pro:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
